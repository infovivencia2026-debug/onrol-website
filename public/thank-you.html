  .ty{ max-width:720px; margin:0 auto; padding:clamp(120px,20vh,200px) 24px 100px; text-align:center; }

  .ty a.wa{ background:#16181b; color:#fff; } .ty a.wa:hover{ background:#1faf57; transform:translateY(-2px); }
  .ty a.home{ background:var(--orange); color:#fff; } .ty a.home:hover{ background:var(--orange-lt); transform:translateY(-2px); }

<main class="ty">
  <span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
  <h1>You're <span>in.</span></h1>
  <p id="tyProgram">Your registration has been received.</p>
  <p>Our team will confirm your seat with fees, schedule, and the full cohort guide on WhatsApp within 24 hours.</p>
  <div class="actions">
    <a class="btn wa" id="waLink" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.6-2c-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5s0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.3 5.1 4.6.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15l-1.3 4.7L7 20.4A10 10 0 1 0 12 2z"/></svg>
      Message us on WhatsApp
    </a>
    <a class="btn home" href="/">Back to home</a>
  </div>

<script>
  /* personalise + wire WhatsApp + fire conversion pixels */
  (function(){
    var cfg = window.ONROL || {};
    var params = new URLSearchParams(location.search);
    var program = params.get('p') || '';
    if (program){ document.getElementById('tyProgram').textContent = 'Your registration for the ' + program + ' has been received.'; }
    var wa = document.getElementById('waLink');
    var num = cfg.whatsappNumber || '918121306701';
    var msg = 'Hi ONROL, I just registered' + (program ? ' for the ' + program : '') + '. Please confirm my seat.';
    wa.href = 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);
    if (window.fbq) window.fbq('track', 'Lead', { content_name: program });
    if (window.gtag) window.gtag('event', 'conversion', { program: program });
  })();
  /* nav toggle */
  (function(){ var n=document.querySelector('.nav'),t=document.getElementById('navToggle'); if(!n||!t)return;
    t.addEventListener('click',function(){var o=n.classList.toggle('open');t.setAttribute('aria-expanded',o?'true':'false');}); })();
</script>
<script>(function(){try{var path=(location.pathname.replace(/\/+$/,"")||"/");document.querySelectorAll(".nav-links a[href]").forEach(function(a){var raw=(a.getAttribute("href")||"").split("#")[0];var href=raw?(raw.replace(/\/+$/,"")||"/"):"/";a.classList.toggle("is-active",href===path);});}catch(e){}})();</script>
