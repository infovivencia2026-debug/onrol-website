    <!-- Inter (body) + Manrope (hero headline) loaded via JS-injected <link>.
         Lighthouse flags rel="preload" as="style" onload=... as render-blocking
         (370ms in mobile audits). Injecting the link tag from JS after parse-time
         means it never enters the critical path: the parser never sees a
         stylesheet to wait on, FCP/LCP are not gated, and the fonts still
         arrive within ~100ms of paint. Hero H1 has a system-font fallback in
         its inline style so it doesn't visually shift when Manrope swaps. -->
    <script>
      (function () {
        // Figtree (body/UI) + Fira Sans (headings) + Sora / Instrument Serif (glydi hero) — Google Fonts, off the
        // critical path (media=print → all onload). display=swap, no CLS.
        var preconnect1 = document.createElement('link');
        preconnect1.rel = 'preconnect';
        preconnect1.href = 'https://fonts.googleapis.com';
        document.head.appendChild(preconnect1);
        var preconnect2 = document.createElement('link');
        preconnect2.rel = 'preconnect';
        preconnect2.href = 'https://fonts.gstatic.com';
        preconnect2.crossOrigin = 'anonymous';
        document.head.appendChild(preconnect2);
        var fonts = document.createElement('link');
        fonts.rel = 'stylesheet';
        fonts.href = 'https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&family=Fira+Sans:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Archivo:wdth,wght@62..125,400..900&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap';
        fonts.media = 'print';
        fonts.onload = function () { this.media = 'all'; };
        document.head.appendChild(fonts);
      })();
    </script>
    <!-- No <noscript> fallback for Inter on purpose: Lighthouse treats
         the noscript <link rel="stylesheet"> as render-blocking and
         was costing 420ms on the home audit. Users with JS disabled
         still get a readable system-font experience. -->
